[package]
name = "dprmapedit"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.0", features = ["serialize", "exr"] }
bevy_egui = { version = "0.43.1", default-features = false, features = ["default_fonts", "manage_clipboard", "render"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.100"
bincode = "2.0.1"
bytemuck = "1.23.2"  # or "ron" if you prefer
rfd = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }

# Standalone: this crate is not a member of any enclosing workspace (it may be
# checked out as a submodule inside one that pins a different Bevy).
[workspace]
